<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 100" width="100%" height="100%">
  <!-- Left Emblem (Embedded high-res upgraded seal) -->
  <g transform="translate(10, 5)">
    <circle cx="45" cy="45" r="44" fill="#ffffff" stroke="#1e3a8a" stroke-width="1.5"/>
    <image href="bvf-logo-upgraded.png" x="2" y="2" width="86" height="86" />
  </g>

  <!-- Typography Right (Using <tspan> to guarantee zero text overlap on any platform) -->
  <g transform="translate(112, 0)">
    <text x="0" y="44" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif" font-size="28" letter-spacing="0.5">
      <tspan font-weight="900" fill="#0f172a">BEST VISION </tspan>
      <tspan font-weight="400" fill="#0284c7">FOUNDATION</tspan>
    </text>

    <!-- Sub-tagline -->
    <text x="0" y="66" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11.5" font-weight="700" fill="#059669" letter-spacing="1.5">
      SRI LANKA NGO • ESTABLISHED 2021
    </text>

    <!-- Registration -->
    <text x="0" y="84" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="10.5" font-weight="500" fill="#64748b" letter-spacing="0.3">
      Govt. Reg No: L-184510 | Negombo, Sri Lanka
    </text>
  </g>
</svg>
