<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cyberSky" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e1b4b"/>
      <stop offset="100%" stop-color="#0f766e"/>
    </linearGradient>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fbbf24"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="500" fill="url(#cyberSky)"/>

  <!-- Network Grid & Nodes -->
  <g stroke="#38bdf8" stroke-opacity="0.15" stroke-width="1.5">
    <line x1="100" y1="100" x2="250" y2="160"/>
    <line x1="250" y1="160" x2="400" y2="100"/>
    <line x1="400" y1="100" x2="550" y2="160"/>
    <line x1="550" y1="160" x2="700" y2="120"/>
    
    <line x1="150" y1="350" x2="280" y2="280"/>
    <line x1="280" y1="280" x2="400" y2="380"/>
    <line x1="400" y1="380" x2="520" y2="300"/>
    <line x1="520" y1="300" x2="680" y2="360"/>

    <line x1="250" y1="160" x2="280" y2="280"/>
    <line x1="550" y1="160" x2="520" y2="300"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="100" cy="100" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="250" cy="160" r="7" fill="#34d399" opacity="0.8"/>
  <circle cx="400" cy="100" r="6" fill="#38bdf8" opacity="0.7"/>
  <circle cx="550" cy="160" r="8" fill="#fbbf24" opacity="0.8"/>
  <circle cx="700" cy="120" r="5" fill="#38bdf8" opacity="0.6"/>
  <circle cx="150" cy="350" r="6" fill="#38bdf8" opacity="0.5"/>
  <circle cx="280" cy="280" r="7" fill="#38bdf8" opacity="0.7"/>
  <circle cx="400" cy="380" r="6" fill="#34d399" opacity="0.8"/>
  <circle cx="520" cy="300" r="7" fill="#38bdf8" opacity="0.7"/>
  <circle cx="680" cy="360" r="6" fill="#fbbf24" opacity="0.6"/>

  <!-- Central Shield of Digital Safety & Ethics -->
  <g transform="translate(400, 240)">
    <!-- Outer Glow -->
    <path d="M 0 -100 Q 80 -100 90 -40 Q 95 60 0 110 Q -95 60 -90 -40 Q -80 -100 0 -100 Z" fill="#0284c7" opacity="0.25"/>
    <!-- Shield -->
    <path d="M 0 -90 Q 70 -90 80 -35 Q 85 50 0 95 Q -85 50 -80 -35 Q -70 -90 0 -90 Z" fill="url(#shieldGrad)" stroke="#7dd3fc" stroke-width="4"/>
    
    <!-- Checkmark & Lock inside Shield -->
    <circle cx="0" cy="-10" r="28" fill="#ffffff" opacity="0.2"/>
    <path d="M -18 -8 L -6 4 L 18 -20" stroke="#ffffff" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Human Rights / Free Speech Ribbon -->
    <rect x="-65" y="30" width="130" height="24" rx="12" fill="url(#goldGrad)"/>
    <text x="0" y="47" font-family="'Inter', sans-serif" font-size="12" font-weight="800" fill="#0f172a" text-anchor="middle" letter-spacing="1">ETHICAL MEDIA</text>
  </g>

  <!-- Community People silhouettes uniting hands -->
  <g fill="#cbd5e1" opacity="0.9">
    <circle cx="220" cy="380" r="16"/>
    <path d="M 195 440 C 195 410 245 410 245 440 Z"/>
    
    <circle cx="270" cy="360" r="18"/>
    <path d="M 240 440 C 240 400 300 400 300 440 Z"/>

    <circle cx="530" cy="360" r="18"/>
    <path d="M 500 440 C 500 400 560 400 560 440 Z"/>

    <circle cx="580" cy="380" r="16"/>
    <path d="M 555 440 C 555 410 605 410 605 440 Z"/>
  </g>

  <!-- Top Badge -->
  <g transform="translate(50, 40)">
    <rect width="280" height="48" rx="24" fill="#0f172a" fill-opacity="0.8" stroke="#38bdf8" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="14" fill="#38bdf8"/>
    <text x="24" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="900" fill="#0f172a">#</text>
    <text x="52" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#f8fafc">Digital Rights &amp; CSMD</text>
  </g>
</svg>
