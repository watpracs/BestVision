<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="warmSun" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fff7ed"/>
      <stop offset="50%" stop-color="#fed7aa"/>
      <stop offset="100%" stop-color="#bbf7d0"/>
    </linearGradient>
    <linearGradient id="coastGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="60%" stop-color="#059669"/>
      <stop offset="100%" stop-color="#047857"/>
    </linearGradient>
  </defs>

  <rect width="800" height="500" fill="url(#warmSun)"/>
  
  <!-- Coastal hill / community ground -->
  <path d="M 0 350 Q 250 280 500 330 T 800 300 L 800 500 L 0 500 Z" fill="url(#coastGrad)"/>

  <!-- Palm Trees -->
  <g transform="translate(120, 160)">
    <path d="M 20 200 Q 15 100 60 20" stroke="#78350f" stroke-width="9" fill="none" stroke-linecap="round"/>
    <path d="M 60 20 Q 30 -10 -20 10" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 60 20 Q 60 -25 50 -50" stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 60 20 Q 90 -20 130 5" stroke="#16a34a" stroke-width="6" fill="none" stroke-linecap="round"/>
    <path d="M 60 20 Q 100 20 120 50" stroke="#15803d" stroke-width="6" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Community Gathering / Volunteers planting and working together -->
  <g transform="translate(420, 260)">
    <!-- Volunteer 1 (Planting) -->
    <circle cx="50" cy="50" r="16" fill="#fed7aa"/>
    <path d="M 50 66 L 50 110 M 35 80 L 10 110 M 65 80 L 85 95" stroke="#0284c7" stroke-width="6" stroke-linecap="round"/>
    <!-- Plant in hand -->
    <path d="M 85 95 Q 95 80 90 70 M 85 95 Q 100 90 105 85" stroke="#22c55e" stroke-width="4" stroke-linecap="round"/>
    <!-- Legs -->
    <path d="M 50 110 L 35 150 M 50 110 L 65 150" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- Volunteer 2 (Holding hands / Teaching) -->
    <circle cx="160" cy="40" r="16" fill="#fed7aa"/>
    <path d="M 160 56 L 160 105 M 145 70 L 115 85 M 175 70 L 205 85" stroke="#e11d48" stroke-width="6" stroke-linecap="round"/>
    <path d="M 160 105 L 145 150 M 160 105 L 175 150" stroke="#1e293b" stroke-width="6" stroke-linecap="round"/>

    <!-- Child / Youth learning -->
    <circle cx="230" cy="80" r="13" fill="#fed7aa"/>
    <path d="M 230 93 L 230 125 M 220 105 L 205 85 M 240 105 L 255 120" stroke="#ca8a04" stroke-width="5" stroke-linecap="round"/>
    <path d="M 230 125 L 220 155 M 230 125 L 240 155" stroke="#334155" stroke-width="5" stroke-linecap="round"/>
  </g>

  <!-- Sprouting seedlings on ground -->
  <g stroke="#4ade80" stroke-width="3" stroke-linecap="round" fill="none">
    <path d="M 280 430 Q 285 410 290 400 M 290 400 Q 275 390 280 400 M 290 400 Q 305 390 300 400"/>
    <path d="M 680 410 Q 685 390 690 380 M 690 380 Q 675 370 680 380 M 690 380 Q 705 370 700 380"/>
  </g>

  <!-- Badge Overlay -->
  <g transform="translate(50, 40)">
    <rect width="280" height="48" rx="24" fill="#ffffff" fill-opacity="0.95" stroke="#059669" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="14" fill="#059669"/>
    <path d="M 24 24 Q 28 18 32 24 T 32 30" stroke="#ffffff" stroke-width="2.5" fill="none"/>
    <text x="52" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#065f46">Community Resilience</text>
  </g>
</svg>
