<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <linearGradient id="savannaSky" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#fed7aa"/>
      <stop offset="40%" stop-color="#ffedd5"/>
      <stop offset="100%" stop-color="#dcfce7"/>
    </linearGradient>
    <linearGradient id="groundGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8a04"/>
      <stop offset="30%" stop-color="#65a30d"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
    <linearGradient id="elephantGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
  </defs>

  <!-- Sky -->
  <rect width="800" height="500" fill="url(#savannaSky)"/>

  <!-- Golden Warm Sun -->
  <circle cx="200" cy="130" r="70" fill="#f59e0b" opacity="0.35"/>
  <circle cx="200" cy="130" r="50" fill="#fbbf24" opacity="0.8"/>

  <!-- Distant Jungle Ridges -->
  <path d="M 0 260 Q 200 210 400 240 T 800 230 L 800 500 L 0 500 Z" fill="#84cc16" opacity="0.3"/>
  <path d="M 0 280 Q 250 250 500 270 T 800 265 L 800 500 L 0 500 Z" fill="#4d7c0f" opacity="0.4"/>

  <!-- Rolling Landscape -->
  <path d="M 0 320 Q 300 290 600 330 T 800 320 L 800 500 L 0 500 Z" fill="url(#groundGrad)"/>

  <!-- Acacia / Forest Trees -->
  <g transform="translate(620, 180)">
    <path d="M 50 140 L 50 50 M 50 80 L 20 40 M 50 70 L 80 30" stroke="#78350f" stroke-width="8" stroke-linecap="round"/>
    <ellipse cx="50" cy="30" rx="70" ry="25" fill="#15803d"/>
    <ellipse cx="20" cy="35" rx="40" ry="18" fill="#166534"/>
    <ellipse cx="75" cy="25" rx="45" ry="20" fill="#22c55e"/>
  </g>

  <!-- Elephant Family Silhouette (Mother and Calf) -->
  <!-- Mother Elephant -->
  <g transform="translate(320, 220)">
    <!-- Body -->
    <ellipse cx="140" cy="130" rx="90" ry="65" fill="url(#elephantGrad)"/>
    <!-- Head -->
    <circle cx="60" cy="100" r="45" fill="url(#elephantGrad)"/>
    <!-- Ear -->
    <path d="M 55 75 C 20 85 30 140 70 135 Z" fill="#475569"/>
    <!-- Trunk -->
    <path d="M 35 110 C 10 130 10 170 30 185 C 38 185 40 175 32 170 C 22 155 24 135 45 125 Z" fill="url(#elephantGrad)"/>
    <!-- Tusk -->
    <path d="M 45 128 Q 20 135 25 150 Q 32 145 42 135 Z" fill="#fef08a"/>
    <!-- Legs -->
    <rect x="75" y="160" width="28" height="70" rx="10" fill="url(#elephantGrad)"/>
    <rect x="115" y="160" width="26" height="65" rx="10" fill="#475569"/>
    <rect x="175" y="160" width="28" height="70" rx="10" fill="url(#elephantGrad)"/>
    <rect x="205" y="160" width="25" height="65" rx="10" fill="#475569"/>
    <!-- Tail -->
    <path d="M 225 120 Q 240 140 235 180" stroke="#334155" stroke-width="4" stroke-linecap="round"/>
  </g>

  <!-- Baby Elephant -->
  <g transform="translate(240, 290)">
    <ellipse cx="60" cy="65" rx="45" ry="32" fill="url(#elephantGrad)"/>
    <circle cx="25" cy="50" r="24" fill="url(#elephantGrad)"/>
    <path d="M 22 38 C 5 45 10 70 30 68 Z" fill="#475569"/>
    <path d="M 12 55 Q 0 70 10 82 Q 15 78 12 70 Q 8 62 18 58 Z" fill="url(#elephantGrad)"/>
    <rect x="30" y="80" width="14" height="35" rx="5" fill="url(#elephantGrad)"/>
    <rect x="50" y="80" width="14" height="32" rx="5" fill="#475569"/>
    <rect x="75" y="80" width="14" height="35" rx="5" fill="url(#elephantGrad)"/>
    <rect x="90" y="80" width="13" height="32" rx="5" fill="#475569"/>
  </g>

  <!-- Grass Blades in foreground -->
  <g stroke="#15803d" stroke-width="3" stroke-linecap="round">
    <line x1="80" y1="450" x2="90" y2="400"/>
    <line x1="90" y1="450" x2="105" y2="410"/>
    <line x1="160" y1="460" x2="170" y2="410"/>
    <line x1="560" y1="450" x2="575" y2="395"/>
    <line x1="580" y1="450" x2="595" y2="405"/>
    <line x1="720" y1="460" x2="710" y2="400"/>
  </g>

  <!-- Protection Badge Overlay -->
  <g transform="translate(50, 40)">
    <rect width="270" height="48" rx="24" fill="#ffffff" fill-opacity="0.9" stroke="#16a34a" stroke-width="1.5"/>
    <circle cx="28" cy="24" r="14" fill="#16a34a"/>
    <path d="M 23 24 L 27 28 L 34 20" stroke="#ffffff" stroke-width="2.5" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="52" y="29" font-family="'Inter', sans-serif" font-size="14" font-weight="700" fill="#15803d">Elephant &amp; Wildlife Care</text>
  </g>
</svg>
